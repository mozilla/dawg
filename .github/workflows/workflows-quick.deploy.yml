# Auto-deploy this repo to Quick on merge to main
name: Deploy to Quick
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site:
        description: "Site name to deploy to (default: the repo name)"
        type: string
        default: ""
      force:
        description: Overwrite even if the site was last deployed by someone else
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DIR: dist
      QUICK_DEPLOYED_BY: github:${{ github.repository }}
      # Quick project: nonprod only when the QUICK_ENV variable is 'stage'; prod otherwise.
      QUICK_PROJECT: ${{ vars.QUICK_ENV == 'stage' && 'moz-fx-quick-nonprod' || 'moz-fx-quick-prod' }}
    steps:
      - uses: actions/checkout@v4
      # DIR is a Vite build, not committed. build:quick, not build — it also
      # writes the 404.html the SPA fallback needs.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:quick
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCPV2_GITHUB_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: quick-gha-deploy@${{ env.QUICK_PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Quick
        env:
          SITE: ${{ inputs.site || vars.QUICK_SITE || 'dawg' }}
        run: |
          gcloud storage cp "gs://${QUICK_PROJECT}-cli/quick-linux-amd64" "$RUNNER_TEMP/quick"
          chmod +x "$RUNNER_TEMP/quick"
          "$RUNNER_TEMP/quick" deploy "$DIR" "$SITE" --mirror ${{ inputs.force && '--yes' || '' }}
